name: Lint and Format

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fix:
        description: "Auto-fix lint issues and format code, then commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Auto-fix and format
        if: github.event_name == 'workflow_dispatch' && inputs.fix
        run: |
          ruff check . --fix
          ruff format .

      - name: Commit fixes
        if: github.event_name == 'workflow_dispatch' && inputs.fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "style: apply ruff fixes and formatting" && git push)

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Ruff
        run: ruff format --check .
