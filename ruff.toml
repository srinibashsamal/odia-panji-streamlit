line-length = 88
target-version = "py311"

[lint]
# E/W = style errors, F = Pyflakes, I = import sorting,
# UP = modern Python syntax, B = common bugs
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are left to the formatter

[format]
quote-style = "double"
indent-style = "space"
