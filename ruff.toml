line-length = 88
target-version = "py311"
# extend-exclude = ["node_modules", "migrations"]

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    # "PT",   # flake8-pytest-style
    # "T20",  # flake8-print
    # "D",    # pydocstyle (enable later)
]
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # function calls in argument defaults
    "W191",  # tab indentation (conflicts with formatter)
    "E111",  # indentation not multiple of four
    "E114",  # conflicts with formatter
    "E117",  # conflicts with formatter
]
fixable = ["ALL"]

# [lint.per-file-ignores]
# "tests/*" = ["S101"]      # allow assert in tests
# "__init__.py" = ["F401"]  # allow unused imports in __init__
# "migrations/*" = ["E501"]

[lint.isort]
known-first-party = ["app_constants"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
